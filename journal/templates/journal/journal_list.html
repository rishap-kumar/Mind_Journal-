{% extends "journal/menu.html" %}

{% block content %}

<div class="max-w-6xl mx-auto px-6 py-10">

    <h1 class="text-4xl font-bold text-center text-white mb-10">
        📖 My Journal Entries
    </h1>

    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">

        {% for i in journal %}

        <div class="bg-white rounded-2xl shadow-xl p-6 hover:scale-105 transition duration-300">

            <h2 class="text-2xl font-bold text-blue-700 mb-3">
                {{ i.title }}
            </h2>

            <p class="text-gray-700 mb-4 leading-relaxed">
                {{ i.thought }}
            </p>

            <div class="border-t pt-3">

                <p class="text-sm text-gray-500">
                    🕒 {{ i.created_at }}
                </p>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
